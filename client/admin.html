<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyStore - Admin</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav>
    <a class="logo" href="index.html">MyStore</a>
    <div id="nav-links"></div>
  </nav>

  <div class="page">
    <h2>Admin dashboard</h2>

    <div class="panel">
      <h3 id="form-title">Add product</h3>
      <p class="msg" id="msg"></p>
      <div class="form-grid">
        <input type="text" id="p-name" placeholder="Name" />
        <input type="text" id="p-category" placeholder="Category" />
        <input type="number" id="p-price" placeholder="Price" min="0" step="0.01" />
        <input type="number" id="p-stock" placeholder="Stock" min="0" />
      </div>
      <input type="text" id="p-image" placeholder="Image URL (optional)" />
      <textarea id="p-description" placeholder="Description"></textarea>
      <button class="btn" id="save-btn" onclick="saveProduct()">Add product</button>
      <button class="btn btn-outline" onclick="resetForm()">Clear</button>
    </div>

    <h3>Products</h3>
    <div id="admin-products" class="panel"></div>

    <h3>Orders</h3>
    <div id="admin-orders" class="panel"></div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
